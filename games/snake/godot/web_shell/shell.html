<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Neon Snake</title>
  <meta name="description" content="Snake, made new: a glowing snake that glides, combos and bonus stars.">
  <meta name="theme-color" content="#04050b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shell.css">
  <script id="godot-config" type="application/json">$GODOT_CONFIG</script>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser does not support the canvas element.</canvas>
  <div id="status" role="status">
    <h1>Neon Snake</h1>
    <div class="bar"><div id="bar-fill"></div></div>
    <p id="notice"></p>
  </div>
  <noscript>Neon Snake needs JavaScript.</noscript>
  <script src="$GODOT_URL"></script>
  <script src="boot.js"></script>
</body>
</html>
