<title>Yule Advent Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: one tall storybook illustration of a snowy timber house. 24 red shuttered windows sit in its wall. Tapping one peels the shutter open, then the window grows into a framed card where a friend does one little animation. Tap the card to close it. Single committed night look. */
:root{
  --night:#0a1030; --gold:#f4c95d; --berry:#b3243b; --snow:#f5f8ff; --mute:#9fb0d8;
  --display:'Mountains of Christmas',Georgia,serif; --body:'DM Sans',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:#050b2a;color:var(--snow);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.stage{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:390/960;container-type:inline-size;overflow:hidden;background:#0a1030}
.stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.title{position:absolute;left:0;right:0;top:2.4%;text-align:center;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
.title small{display:block;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700;font-size:3.1cqw}
.title h1{margin:.5cqw 0 0;font-family:var(--display);font-size:15.5cqw;line-height:.95;
  background:linear-gradient(180deg,#fff7d9,#f4c95d 60%,#d99a35);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .6cqw 2.4cqw rgba(0,0,0,.55))}

/* windows */
.win{position:absolute;perspective:520px;z-index:2}
.win::before{content:"";position:absolute;left:-5%;right:-5%;top:-4.4cqw;height:5.4cqw;background:linear-gradient(#fff,#dbe6fb);border-radius:3.4cqw 3.4cqw .8cqw .8cqw;box-shadow:0 .6cqw 0 rgba(90,110,170,.35);pointer-events:none;z-index:3}
.win::after{content:"";position:absolute;left:-7%;right:-7%;bottom:-2.3cqw;height:2.6cqw;background:linear-gradient(#f4f7ff 0 35%,#7a4520 36%);border-radius:.8cqw;box-shadow:0 .5cqw .8cqw rgba(0,0,0,.35);pointer-events:none}
.glass{position:absolute;inset:0;border-radius:.8cqw;background:radial-gradient(circle at 50% 70%,#fff0b8,#f6b13e 55%,#8a3b12);box-shadow:inset 0 0 3cqw rgba(0,0,0,.55);display:grid;place-items:center}
.glass svg{width:34%;color:#fff;opacity:.9;filter:drop-shadow(0 0 1.4cqw #ffd470)}
.door{position:absolute;inset:0;padding:0;border:.45cqw solid #5a1519;border-radius:.9cqw;cursor:pointer;transform-origin:left center;
  background:linear-gradient(165deg,#cf3b32,#92222a);box-shadow:.4cqw .6cqw 1.2cqw rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;color:#fff5d6}
.door::before{content:"";position:absolute;inset:1.1cqw;border:1px solid rgba(255,230,190,.35);border-radius:.6cqw;pointer-events:none}
.door::after{content:"";position:absolute;right:1.5cqw;top:50%;width:2.4cqw;height:2.4cqw;margin-top:-1.2cqw;border:.5cqw solid #1d1618;border-radius:50%;opacity:.85;pointer-events:none}
.door .n{font-family:var(--display);font-size:7.4cqw;line-height:1;text-shadow:0 .4cqw 0 rgba(0,0,0,.4)}
.door svg{width:30%;color:#f2dfae;opacity:.9}
.win.seen .n::after{content:"";display:block;width:2.6cqw;height:2.6cqw;margin:.5cqw auto -1cqw;background:var(--gold);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.win.lock .door{filter:saturate(.6) brightness(.82)}
.win.lock .n::before{content:"";display:block;width:2.4cqw;height:1.8cqw;margin:0 auto .5cqw;border-radius:.4cqw;background:var(--gold);opacity:.75}
.win.open .door{animation:peelOpen .8s cubic-bezier(.3,.7,.2,1) forwards;pointer-events:none}
.win.closing .door{animation:peelClose .6s cubic-bezier(.5,0,.3,1) forwards;pointer-events:none}
.win.shake{animation:shake .4s}
@keyframes peelOpen{0%{transform:rotateY(0)}20%{transform:rotateY(-15deg) skewY(-3deg)}100%{transform:rotateY(-160deg)}}
@keyframes peelClose{0%{transform:rotateY(-160deg)}70%{transform:rotateY(-12deg) skewY(-2deg)}100%{transform:rotateY(0)}}
@keyframes shake{20%{transform:translateX(-.8cqw)}40%{transform:translateX(.8cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}

.foot{max-width:520px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) max(30px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;font-size:13px;text-align:center;background:#c0cff0;color:#2c3a66}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw i{width:40px;height:22px;border-radius:11px;background:#7e8fc4;position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:#1f6f58}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid #b3243b;outline-offset:3px}
.link{background:none;border:0;text-decoration:underline;color:#2c3a66;cursor:pointer;padding:4px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#0a1030;border:1px solid var(--gold);color:var(--snow);padding:10px 16px;border-radius:999px;transition:.3s;z-index:80;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* opened window */
.veil{position:fixed;inset:0;z-index:50;background:rgba(4,6,20,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.veil.on{opacity:1;visibility:visible;transition:opacity .4s}
.wrap{position:fixed;inset:0;z-index:51;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.wrap.on{display:flex}
.card{width:min(94vw,calc((100dvh - 120px) * .5625),400px);aspect-ratio:9/16;border-radius:22px;pointer-events:auto;cursor:pointer;transform-origin:0 0;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 60px rgba(244,201,93,.2);touch-action:manipulation}
.card canvas{width:100%;height:100%;display:block;border-radius:22px}
.cap{text-align:center;max-width:min(94vw,400px);opacity:0;transition:opacity .4s;pointer-events:none}
.cap.on{opacity:1}
.cap h3{font-family:var(--display);font-size:28px;line-height:1.05;margin:0 0 2px}
.cap p{margin:0;color:#cdd8f5;font-size:14px;text-wrap:pretty}
.cap small{display:block;margin-top:4px;color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
@media (prefers-reduced-motion:reduce){.win.open .door,.win.closing .door{animation-duration:.01s}}
</style>

<div class="stage" id="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="title"><small id="yr">Yuletide</small><h1>Advent</h1></div>
</div>
<div class="foot">
  <label class="sw"><input type="checkbox" id="preview"><i></i><span id="pvlabel">Preview mode: every window opens</span></label>
  <button class="link" id="reset" type="button">Close and forget all the windows</button>
</div>
<div class="veil" id="veil"></div>
<div class="wrap" id="wrap">
  <div class="card" id="card" role="button" tabindex="0" aria-label="Tap to close this window"><canvas id="scene"></canvas></div>
  <div class="cap" id="cap"><h3 id="vt"></h3><p id="vm"></p><small>Tap the window to close it</small></div>
</div>
<div class="toast" id="toast" role="status"></div>
