<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1a2b"/><stop offset="1" stop-color="#1b1220"/></linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fa7ff"/><stop offset=".5" stop-color="#f3f0e8"/><stop offset="1" stop-color="#ffb02e"/></linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <g fill="#fff" opacity=".8"><circle cx="34" cy="40" r="1.2"/><circle cx="250" cy="28" r="1"/><circle cx="196" cy="86" r="1.3"/><circle cx="70" cy="120" r="1"/></g>
  <!-- the scale: a half dial from cold to hot -->
  <path d="M40 270 A110 110 0 0 1 260 270" fill="none" stroke="url(#scale)" stroke-width="34" stroke-linecap="round"/>
  <!-- the target bands, 2 / 3 / 4 points -->
  <path d="M182 176 A110 110 0 0 1 222 206" fill="none" stroke="#ff6b4a" stroke-width="34" opacity=".55"/>
  <path d="M194 183 A110 110 0 0 1 210 196" fill="none" stroke="#ff3d2e" stroke-width="34" opacity=".85"/>
  <!-- the team's pointer -->
  <line x1="150" y1="270" x2="204" y2="180" stroke="#f3f0e8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="270" r="13" fill="#f3f0e8"/><circle cx="150" cy="270" r="5" fill="#1b1220"/>
  <!-- the two teams -->
  <circle cx="70" cy="330" r="18" fill="#3fa7ff"/><circle cx="230" cy="330" r="18" fill="#ffb02e"/>
  <path d="M60 330h20M70 320v20" stroke="#0d1a2b" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#1b1220" stroke-width="3" stroke-linecap="round"><path d="M230 318v-4M230 346v-4M218 330h-4M246 330h-4"/></g>
  <circle cx="230" cy="330" r="6" fill="#1b1220"/>
</svg>
