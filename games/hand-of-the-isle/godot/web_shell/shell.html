<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hand of the Isle</title>
  <meta name="description" content="An original god game: shape the land and outlast a rival deity.">
  <meta name="theme-color" content="#0b1a2a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shell.css">
  <script id="godot-config" type="application/json">$GODOT_CONFIG</script>
  $GODOT_HEAD_INCLUDE
</head>
<body class="game">
  <canvas id="canvas" tabindex="0">Your browser does not support the canvas element.</canvas>
  <div id="status" role="status">
    <p class="eyebrow">SHAPE THE LAND</p>
    <h1>HAND OF THE ISLE</h1>
    <div class="bar"><div id="bar-fill"></div></div>
    <p id="notice"></p>
  </div>
  <noscript>Hand of the Isle needs JavaScript and WebGL 2.</noscript>
  <script src="$GODOT_URL"></script>
  <script src="../boot.js"></script>
</body>
</html>
