<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shatterbelt</title>
<meta name="description" content="Shatterbelt: break up a drifting rock belt with up to nine pilots on one screen, together or against each other.">
<meta name="theme-color" content="#04060d">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <canvas id="game" role="img" aria-label="Shatterbelt game screen" aria-describedby="live"></canvas>
  <div id="touch" hidden>
    <div class="cluster">
      <button type="button" data-ctl="left" aria-label="Turn left">&#9664;</button>
      <button type="button" data-ctl="right" aria-label="Turn right">&#9654;</button>
    </div>
    <div class="cluster">
      <button type="button" data-ctl="blink" class="small">BLINK</button>
      <button type="button" data-ctl="thrust">THRUST</button>
      <button type="button" data-ctl="fire" class="fire">FIRE</button>
    </div>
  </div>
</main>
<nav id="bar">
  <button id="sound" type="button" aria-pressed="true">SOUND: ON (M)</button>
  <button id="pause" type="button" hidden>PAUSE (P)</button>
  <a href="/games/">MORE GAMES</a>
</nav>
<div id="live" class="sr-only" aria-live="polite"></div>
<noscript><p class="noscript">Shatterbelt needs JavaScript.</p></noscript>
<script src="game.js"></script>
</body>
</html>
