<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>MEG: The Current Remembers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Special+Elite&family=VT323&display=swap">
<style>
:root{
 /* Layout: one arcade screen. The canvas scales to fit; HUD, dossiers and touch controls are HTML laid over it. */
 --abyss:#020a12; --warm:#3fd0a0; --flood:#ffd447; --alarm:#ff9a1f; --blood:#e8413b;
 --paper:#d8ccb0; --ink:#1d1a14; --bone:#e6f1ee; --muted:#7f97a0; --panel:#0b2a38;
 --f-display:"Press Start 2P",ui-monospace,Menlo,monospace;
 --f-doc:"Special Elite","Courier New",Courier,monospace;
 --f-ui:"VT323",ui-monospace,Menlo,monospace;
 color-scheme:dark;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--bone);overflow:hidden;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-ui)}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 1px #0d3344,0 0 40px #0b3a4a66}
#crt{position:absolute;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
#hud{position:absolute;pointer-events:none;line-height:1;color:var(--bone);text-shadow:1px 1px 0 #000}
.meters{position:absolute;left:3%;top:4%;display:grid;gap:.3em;width:36%}
.m{display:grid;grid-template-columns:4.6em 1fr;align-items:center;gap:.4em;letter-spacing:.05em}
.m i{display:block;height:.55em;background:#0009;border:1px solid #ffffff40}
.m b{display:block;height:100%;width:50%;background:var(--warm)}
#hExp{background:var(--alarm)}
#hX{background:#7fc8ff}
.m.low b{background:var(--blood);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#hObj{position:absolute;right:3%;top:4%;text-align:right;max-width:55%;letter-spacing:.04em}
#hObj small{display:block;color:#bfe9dc;font-size:.85em;margin-top:.25em}
#hObj small.alarm{color:var(--blood)}
#banner{position:absolute;left:4%;right:4%;top:38%;text-align:center;font-family:var(--f-display);font-size:.6em;line-height:1.5;letter-spacing:.06em;color:var(--flood);opacity:0;transition:opacity .25s}
#banner.on{opacity:1}
#banner.alarm{color:var(--blood)}
.pad{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));display:grid;gap:10px;align-items:end;justify-items:center;z-index:3}
#padL{left:0;grid-template-columns:auto auto}
#padR{right:0}
.btn{font-family:var(--f-display);font-size:9px;letter-spacing:.02em;color:var(--bone);background:#0b2a38cc;border:2px solid #6fb7c4;border-radius:50%;width:66px;height:66px;padding:0;touch-action:none}
.btn.turn{width:80px;height:80px;font-size:30px;font-family:var(--f-ui);border-color:var(--warm)}
.btn.on{background:#ffffff33;transform:scale(.94)}
#bSwim{width:104px;height:104px;font-size:11px;border-color:var(--flood);background:#2e2608cc}
#hSpd{background:#7f97a0}
#hSpd.fast{background:var(--flood)}
.chips{position:absolute;right:0;top:8px;display:flex;gap:8px;z-index:11}
.chip{font-family:var(--f-ui);font-size:18px;color:var(--bone);background:#0b2a38cc;border:1px solid #6fb7c466;border-radius:3px;padding:4px 10px;min-width:44px;min-height:36px;cursor:pointer}
#screen{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;padding-block:56px 20px;z-index:10;background:radial-gradient(ellipse at center,#020a1288,#020a12f0);touch-action:pan-y}
.panel{width:min(560px,100%);display:grid;gap:14px}
.kicker{font-size:18px;letter-spacing:.18em;color:var(--warm);margin:0}
h1{font-family:var(--f-display);font-size:clamp(44px,14vw,96px);margin:0;color:var(--bone);text-shadow:4px 4px 0 #0b3a4a,0 0 24px #3fd0a055;line-height:1;text-wrap:balance}
h1.h2{font-size:clamp(16px,4.6vw,26px);line-height:1.4;text-shadow:3px 3px 0 #0b3a4a}
.sub{font-family:var(--f-display);font-size:clamp(10px,2.6vw,14px);color:var(--flood);margin:0;line-height:1.6}
.lede{font-size:22px;line-height:1.15;margin:0;max-width:44ch;color:#c9dad6}
.row{display:flex;flex-wrap:wrap;gap:12px}
.cta{font-family:var(--f-display);font-size:12px;line-height:1.4;padding:14px 16px;background:var(--flood);color:#120e02;border:0;border-radius:2px;box-shadow:4px 4px 0 #6b5300;cursor:pointer}
.cta.alt{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 2px #6fb7c4}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #6b5300}
.cta:focus-visible,.chip:focus-visible,.file:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.files span{font-size:18px;color:var(--muted);letter-spacing:.1em;margin-right:4px}
.file{font-family:var(--f-ui);font-size:20px;min-width:44px;min-height:40px;background:var(--panel);color:var(--bone);border:1px solid #6fb7c466;border-radius:2px;cursor:pointer}
.file:disabled{opacity:.3;cursor:default}
.keys{font-size:18px;color:var(--muted);margin:0;line-height:1.2}
.doc{background:var(--paper);color:var(--ink);font-family:var(--f-doc);padding:20px 18px;box-shadow:6px 6px 0 #000a;transform:rotate(-.6deg);position:relative}
.doc .stamp{position:absolute;right:12px;top:12px;font-family:var(--f-display);font-size:9px;color:#a3241f;border:2px solid #a3241f;padding:6px;transform:rotate(6deg);opacity:.85}
.doc h2{font-family:var(--f-doc);font-size:17px;margin:0 0 10px;letter-spacing:.04em;text-wrap:balance;padding-right:96px}
.doc pre{display:grid;white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.5;margin:0}
.doc pre>span{grid-area:1/1}
.ghost{visibility:hidden}
.brief{display:grid;gap:8px;font-size:20px;line-height:1.15}
.brief b{color:var(--flood);font-weight:normal;letter-spacing:.1em;margin-right:6px}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:22px;font-variant-numeric:tabular-nums;justify-content:start}
.stats span:nth-child(odd){color:var(--muted)}
@media (prefers-reduced-motion:reduce){.doc{transform:none}.m.low b{animation:none}}
</style>
</head>
<body>

<div id="stage">
 <canvas id="c" width="256" height="144" aria-label="Game screen"></canvas>
 <div id="crt"></div>
 <div id="hud" hidden>
  <div class="meters">
   <div class="m" id="mHun"><span>HUNGER</span><i><b id="hHun"></b></i></div>
   <div class="m"><span>EXPOSED</span><i><b id="hExp"></b></i></div>
   <div class="m"><span>SPEED</span><i><b id="hSpd"></b></i></div>
   <div class="m" id="mX" hidden><span>CURRENT</span><i><b id="hX"></b></i></div>
  </div>
  <div id="hObj"></div>
  <div id="banner"></div>
 </div>
 <div id="padL" class="pad" hidden>
  <button id="bCCW" class="btn turn" aria-label="Turn counterclockwise">↺</button>
  <button id="bCW" class="btn turn" aria-label="Turn clockwise">↻</button>
 </div>
 <div id="padR" class="pad" hidden>
  <button id="bSwim" class="btn" aria-label="Hold to swim faster">SWIM</button>
 </div>
 <div class="chips">
  <button id="bPause" class="chip" hidden aria-label="Pause">PAUSE</button>
  <button id="bMute" class="chip">SOUND ON</button>
 </div>
 <div id="screen" hidden></div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');
const W=256,H=144,SURF=48,CUR=22;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a), dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const pad2=n=>String(n).padStart(2,'0'), fmt=t=>`${Math.floor(t/60)}:${pad2(Math.floor(t%60))}`;

// ---------- save ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let unlocked=clamp(store.get('meg.unlocked',1)|0,1,8);

// ---------- audio (all synthesized) ----------
let AC=null,master=null,muted=!!store.get('meg.muted',false),noiseBuf=null;
function audio(){ if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination)}catch(e){AC=null} }
function tone(f,d,type='square',v=.06,f2=0,delay=0){ if(!AC||muted)return; const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(master);o.start(t);o.stop(t+d+.02) }
function noise(d,v=.08,hp=400){ if(!AC||muted)return;
 if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain(),t=AC.currentTime;
 s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(f).connect(gn).connect(master);s.start(t);s.stop(t+d+.02) }
const sfx={
 bite(){tone(180,.08,'square',.08,60);noise(.06,.05,1200)}, eat(){tone(520,.06,'square',.05,780)},
 ping(){tone(1320,.6,'sine',.05,1290)}, splash(){noise(.35,.12,300)},
 hit(){tone(90,.25,'sawtooth',.1,40);noise(.15,.08,200)}, boom(){noise(.6,.18,80);tone(70,.5,'sawtooth',.1,30)},
 alarm(){tone(880,.15,'square',.05);tone(660,.15,'square',.05,0,.16)},
 win(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'square',.06,0,i*.12))},
 thunder(){noise(1.6,.2,40)}
};
// Original predator theme: a low bowed-string pulse in a lurching 3+3+2 rhythm, with brass swells.
// It speeds up with the shark's speed and with exposure.
function cello(f,d,v=.1,delay=0){ if(!AC||muted)return; const t=AC.currentTime+delay,o=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),gn=AC.createGain();
 o.type='sawtooth';o2.type='sawtooth';o.frequency.value=f;o2.frequency.value=f*1.007; lp.type='lowpass';lp.frequency.value=f*5;lp.Q.value=3;
 gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+.03);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(lp);o2.connect(lp);lp.connect(gn).connect(master);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05) }
const PAT=[[41.2,1],[0,0],[41.2,.55],[41.2,1],[0,0],[46.25,.7],[41.2,1],[36.7,.6]];
const SWELL=[[82.4,123.5],[87.3,130.8],[82.4,116.5],[73.4,110]];
let musT=0,musStep=0;
function music(dt,k){ if(!AC||muted)return; musT-=dt; if(musT>0)return; const step=.3-.18*k; musT=step;
 const [n,acc]=PAT[musStep%8]; if(n)cello(n,step*1.6,.07+.06*acc);
 if(musStep%8===0)tone(n*.5,.18,'sine',.16,n*.3);
 if(musStep%32===0){ const [a,b]=SWELL[(musStep>>5)%4]; cello(a,step*14,.045); cello(b,step*14,.03) }
 if(k>.6)tone(660*(musStep%2?1:1.06),step*.5,'triangle',.012+.02*(k-.6));
 musStep++ }

// ---------- input ----------
const keys={}, kp={}, tbP={};
const I={turn:0,thrust:false,gpA:false,gpAP:false};
const tb={cw:false,ccw:false,swim:false};
let touchMode=matchMedia('(pointer:coarse)').matches;
addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)&&!(e.target instanceof HTMLButtonElement))e.preventDefault(); if(!e.repeat)kp[e.code]=true; keys[e.code]=true; audio(); onKey(e) });
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('pointerdown',e=>{ if(e.pointerType==='touch'&&!touchMode){touchMode=true;padVis()} },true);
function bindBtn(id,k){ const b=$(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();audio();tb[k]=true;tbP[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}});
 const up=()=>{tb[k]=false;b.classList.remove('on')}; b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up) }
bindBtn('bCW','cw');bindBtn('bCCW','ccw');bindBtn('bSwim','swim');
function getPad(){ try{ if(!navigator.getGamepads)return null; for(const p of navigator.getGamepads())if(p)return p }catch(e){} return null }
// Two controls: left/right turn the shark (counterclockwise/clockwise); holding Space speeds it up, releasing lets it slow down.
function readInput(){
 let turn=0; if(keys.ArrowLeft||keys.KeyA||tb.ccw)turn--; if(keys.ArrowRight||keys.KeyD||tb.cw)turn++;
 let thrust=!!(keys.Space||keys.ArrowUp||keys.KeyW||tb.swim);
 let gpA=false;
 const gp=getPad();
 if(gp){ const ax=gp.axes[0]||0,ay=gp.axes[1]||0; if(Math.abs(ax)>.25)turn+=ax;
  const B=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed); if(B(14))turn--; if(B(15))turn++;
  thrust=thrust||B(0)||B(7)||B(12)||(gp.axes[1]||0)<-.5;
  gpA=B(0)||B(9) }
 I.turn=clamp(turn,-1,1);
 I.thrust=thrust;
 I.gpAP=gpA&&!I.gpA;
 for(const k in kp)delete kp[k]; for(const k in tbP)delete tbP[k];
 I.gpA=gpA }

// ---------- world state & helpers ----------
let world={w:1400,h:360}, S=null, ents=[], parts=[], cam={x:0,y:0}, T=0, shake=0, flashA=0, lv=1, L={vents:[]}, hunt=0, stats=null, state='title', storm=false, lightning=0, boltT=6;
const curY=x=>250+28*Math.sin(x/170)+12*Math.sin(x/61+1);
const inCur=(x,y)=>Math.abs(y-curY(x))<CUR;
const floorY=x=>world.h-12-4*Math.sin(x/40)-3*Math.sin(x/13);
const sx=x=>Math.round(x-cam.x), sy=y=>Math.round(y-cam.y);
function add(e){ents.push(e);return e}
function puff(x,y,n,c,sp=30,life=.6,grav=0){ for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life*rnd(.5,1),max:life,c,g:grav})} }
function bubbles(x,y,n,c='#9fd8e0'){ for(let i=0;i<n;i++)parts.push({x:x+rnd(-3,3),y:y+rnd(-3,3),vx:rnd(-4,4),vy:rnd(-30,-14),life:rnd(.6,1.4),max:1.4,c,g:0,bub:1}) }
function splash(x){ puff(x,SURF,14,'#e6f1ee',50,.6,160) }
function see(rate,dt){ if(S.cloak)return; S.exp+=rate*dt; S.seen=true }
function bump(n){ S.exp+=n }
function hurt(n){ if(S.inv>0)return; S.hunger-=n; S.inv=.6; shake=Math.max(shake,4); sfx.hit(); puff(S.x,S.y,8,'#e8413b',30,.5); flashA=.2 }
function inCone(ox,oy,ang,len,half,x,y){ const dx=x-ox,dy=y-oy,d=Math.hypot(dx,dy); if(d>len||d<1)return false; let da=Math.atan2(dy,dx)-ang; da=Math.atan2(Math.sin(da),Math.cos(da)); return Math.abs(da)<half }
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1; const t=clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1); return Math.hypot(px-ax-t*dx,py-ay-t*dy) }
function cone(ox,oy,ang,len,half,al){ const X=sx(ox),Y=sy(oy); g.save(); g.globalCompositeOperation='lighter';
 const gr=g.createRadialGradient(X,Y,2,X,Y,len); gr.addColorStop(0,`rgba(255,212,71,${al})`); gr.addColorStop(1,'rgba(255,212,71,0)');
 g.fillStyle=gr; g.beginPath(); g.moveTo(X,Y); g.arc(X,Y,len,ang-half,ang+half); g.closePath(); g.fill(); g.restore() }
let bT=null;
function banner(t,d=1.5,al=false){ const b=$('banner'); b.textContent=t; b.className='on'+(al?' alarm':''); clearTimeout(bT); bT=setTimeout(()=>{b.className=al?'alarm':''},d*1000) }
// ---------- sprites ----------
function drawShark(X,Y,a,size,alpha,tp,bite,tint){
 g.save(); g.globalAlpha=alpha; g.translate(X,Y); g.rotate(a); if(Math.cos(a)<0)g.scale(1,-1); g.scale(size,size);
 const w=Math.sin(tp)*2.5, body=tint||'#61798a', dk=tint||'#3f5361';
 g.fillStyle=dk;
 g.beginPath(); g.moveTo(-12,0); g.lineTo(-22,-10+w); g.lineTo(-18,w*.4); g.lineTo(-21,7+w); g.closePath(); g.fill();
 g.beginPath(); g.moveTo(4,-5); g.lineTo(-2,-13); g.lineTo(-5,-4); g.closePath(); g.fill();
 g.beginPath(); g.moveTo(3,3); g.lineTo(-3,10); g.lineTo(-3,4); g.closePath(); g.fill();
 g.fillStyle=body; g.beginPath(); g.moveTo(17,0); g.lineTo(12,-4); g.lineTo(3,-6); g.lineTo(-8,-4.5); g.lineTo(-14,-1.5); g.lineTo(-14,1.5); g.lineTo(-6,4.5); g.lineTo(5,5); g.lineTo(13,3); g.closePath(); g.fill();
 if(!tint){ g.fillStyle='#c4d0cc'; g.beginPath(); g.moveTo(15,1.5); g.lineTo(5,5); g.lineTo(-6,4.5); g.lineTo(-11,2); g.lineTo(6,1.5); g.closePath(); g.fill();
  g.fillStyle='#0b1a26'; g.fillRect(11,-2.5,1.5,1.5); g.fillStyle=dk; for(let i=0;i<3;i++)g.fillRect(6-i*1.6,-1,.7,4) }
 if(bite){ g.fillStyle='#1a0608'; g.beginPath(); g.moveTo(17,0); g.lineTo(9,1); g.lineTo(16,5); g.closePath(); g.fill();
  g.fillStyle='#e6f1ee'; for(let i=0;i<3;i++){g.fillRect(10+i*2,1,1,1);g.fillRect(11+i*2,3.5,1,1)} }
 g.restore() }

// ---------- entities ----------
function fish(x,y,o={}){ return add({k:'fish',x,y,vx:rnd(-10,10),vy:0,hx:x,hy:y,leash:o.leash||null,squid:!!o.squid,ph:Math.random()*9,
 u(dt){ let hx=this.hx,hy=this.hy; if(this.leash&&!this.leash.dead&&!this.leash.sink){hx=this.leash.netX;hy=this.leash.netY} else this.hx+=Math.sin(T*.2+this.ph)*6*dt;
  let ax=(hx-this.x)*.6+Math.sin(T*2+this.ph)*14, ay=(hy-this.y)*.6+Math.cos(T*1.7+this.ph)*10;
  const d=dist(this.x,this.y,S.x,S.y); if(d<42*S.size&&d>0&&!S.cloak){ax+=(this.x-S.x)/d*160;ay+=(this.y-S.y)/d*160}
  this.vx+=ax*dt;this.vy+=ay*dt; const m=this.squid?60:48,sp=Math.hypot(this.vx,this.vy); if(sp>m){this.vx*=m/sp;this.vy*=m/sp}
  this.vx*=1-.8*dt;this.vy*=1-.8*dt; this.x=clamp(this.x+this.vx*dt,4,world.w-4); this.y=clamp(this.y+this.vy*dt,SURF+6,floorY(this.x)-4) },
 d(){ const X=sx(this.x),Y=sy(this.y); if(X<-6||X>W+6||Y<-6||Y>H+6)return; const f=this.vx>=0?1:-1;
  if(this.squid){g.fillStyle='#d07aa0';g.fillRect(X-2,Y-1,4,3);g.fillRect(X-f*3,Y,1,1);g.fillRect(X-f*4,Y+1,1,1)}
  else{g.fillStyle='#9fd8e0';g.fillRect(X-1,Y,3,1);g.fillRect(X-f*2,Y-((T*8+this.ph)|0)%2,1,1)} },
 b(m,r){ if(dist(m.x,m.y,this.x,this.y)<r+2){this.dead=true;S.hunger+=this.squid?12:6;stats.fish++;sfx.eat();puff(this.x,this.y,4,'#9fd8e0',20,.3);return true} return false } }) }
function school(x,y,n,o){ for(let i=0;i<n;i++)fish(x+rnd(-14,14),y+rnd(-10,10),o) }

function freshStats(){ return {time:0,fish:0,buoys:0,photos:0,camera:false,whale:0,subDown:false,sunk:0,drums:0,hits:0,turrets:0,drones:0,breaches:0,peak:0} }
const MAXV=125, FASTV=100; // FASTV: speed needed to ram a hull or leap out of the water
function newShark(size){ return {x:110,y:190,vx:0,vy:0,a:0,face:1,size,spd:30,hunger:85,exp:0,air:false,lunge:0,lungeCd:0,holdT:0,biteT:0,cloak:false,inv:0,tail:0,snag:0,seen:false,maxed:false,hintT:0} }
// ---------- the shark ----------
function mouth(){ return {x:S.x+Math.cos(S.a)*14*S.size, y:S.y+Math.sin(S.a)*14*S.size} }
function doBite(){ const m=mouth(),r=10*S.size; for(const e of ents){ if(!e.dead&&e.b&&e.b(m,r))return true } return false }
function hint(t){ if(S.hintT>0)return; S.hintT=4; banner(t,1.6) }
function updShark(dt){
 const s=S, inC=inCur(s.x,s.y);
 s.cloak=inC&&!s.air; // hidden automatically whenever inside the warm current
 s.biteT-=dt; s.inv-=dt; s.snag-=dt; s.hintT-=dt;
 // hold to speed up, release to drift down to a stop; tap repeatedly to hold a middle speed
 s.spd=I.thrust?Math.min(MAXV,s.spd+85*dt):Math.max(0,s.spd-55*dt);
 const fast=s.spd>=FASTV; s.lunge=fast?1:0;
 // biting is automatic: the jaws close on anything edible that touches the mouth
 if(s.biteT<=0&&doBite()){ s.biteT=.28; sfx.bite() }
 if(!s.air){
  s.a+=I.turn*(2.8-s.spd/MAXV*1.05)*dt;
  const want=s.spd*(s.snag>0?.45:1), k=Math.min(1,dt*4);
  s.vx+=(Math.cos(s.a)*want-s.vx)*k; s.vy+=(Math.sin(s.a)*want-s.vy)*k;
  // breaching is automatic: break the surface heading upward at full speed
  if(s.y<SURF+7&&fast&&Math.sin(s.a)<-.35){ s.vy=Math.min(-110,Math.sin(s.a)*160); s.vx=Math.cos(s.a)*s.spd*.6; s.air=true; sfx.splash(); splash(s.x); bump(10); stats.breaches++ }
  if(!s.air&&s.y<SURF+5){ s.y=SURF+5; if(s.vy<0)s.vy*=.2 }
 } else {
  s.vy+=300*dt; s.vx-=s.vx*.3*dt;
  const ta=Math.atan2(s.vy,s.vx); let da=ta-s.a; da=Math.atan2(Math.sin(da),Math.cos(da)); s.a+=da*Math.min(1,dt*6);
  if(s.y>SURF+4&&s.vy>0){ s.air=false; sfx.splash(); splash(s.x); s.vy*=.5 }
 }
 s.a=Math.atan2(Math.sin(s.a),Math.cos(s.a));
 s.x=clamp(s.x+s.vx*dt,10,world.w-10); s.y=s.y+s.vy*dt;
 const fl=floorY(s.x)-8*s.size; if(s.y>fl){s.y=fl; if(s.vy>0)s.vy=0}
 const sp=Math.hypot(s.vx,s.vy);
 s.face=Math.cos(s.a)>=0?1:-1; s.tail+=dt*(1.5+sp*.12);
 if(fast&&Math.random()<.6)bubbles(s.x-Math.cos(s.a)*16*s.size,s.y-Math.sin(s.a)*16*s.size,1);
 s.hunger-=(1.1+s.spd/MAXV*1.4)*dt;
}
function triggerHunt(){ sfx.alarm(); if(L.onExposed){L.onExposed();return} if(hunt>0)return;
 hunt=18; banner('EXPOSED. HUNTER FLEET INBOUND',2.2,true);
 boat(cam.x-40,{hs:true,dir:1,speed:46,hp:2,len:30,light:true}); boat(cam.x+W+40,{hs:true,dir:-1,speed:46,hp:2,len:30,light:true}) }

// ---------- simulation ----------
function stepParts(dt){ for(const p of parts){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt; if(p.bub&&p.y<SURF+2)p.life=0 } parts=parts.filter(p=>p.life>0); if(parts.length>500)parts.splice(0,parts.length-500) }
function follow(dt,snap){ const tx=clamp(S.x-W/2+S.face*24,0,world.w-W), ty=clamp(S.y-H*.55,0,world.h-H); const k=snap?1:Math.min(1,dt*4); cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k }
function update(dt){
 S.seen=false; updShark(dt);
 for(const e of ents)if(!e.dead)e.u(dt);
 ents=ents.filter(e=>!e.dead);
 if(!S.seen){ const deep=S.y>SURF+140; S.exp-=(inCur(S.x,S.y)||deep?5:1.5)*dt }
 S.exp=clamp(S.exp,0,100); stats.peak=Math.max(stats.peak,S.exp);
 if(S.exp>=100&&!S.maxed){ S.maxed=true; triggerHunt() } if(S.exp<70)S.maxed=false;
 if(hunt>0){ hunt-=dt; if(hunt<=0){ banner('THE FLEET LOSES YOUR TRAIL',1.6); S.exp=Math.min(S.exp,45) } }
 if(L.rage>0)L.rage-=dt;
 S.hunger=clamp(S.hunger,0,100);
 if(L.minFish&&(T*4|0)!==((T-dt)*4|0)){ let n=0; for(const e of ents)if(e.k==='fish')n++;
  if(n<L.minFish){ const x=clamp(S.x+(Math.random()<.5?-1:1)*rnd(170,260),20,world.w-20); const lt=L.leashTo; school(x,rnd(SURF+40,world.h-70),6,lt&&!lt.dead&&!lt.sink&&Math.random()<.5?{leash:lt}:{}) } }
 for(const v of L.vents) if(Math.random()<dt*10)bubbles(v+rnd(-3,3),floorY(v)-12,1,'#ffb35a');
 if(storm){ boltT-=dt; if(boltT<=0){ boltT=rnd(5,9); lightning=RM?0:.15; sfx.thunder() } } lightning=Math.max(0,lightning-dt);
 L.tick&&L.tick(dt);
 stepParts(dt); follow(dt);
 shake=Math.max(0,shake-dt*12); flashA=Math.max(0,flashA-dt*1.5); stats.time+=dt;
 music(dt,hunt>0?1:Math.max(S.exp/100,S.spd/MAXV*.7));
 if(S.hunger<=0)return fail('You grew too weak to hold the current.');
 if(L.failNow)return fail(L.failNow);
 if(L.temp!==undefined&&L.temp<=0)return fail('The current went cold.');
 if(L.check())clear();
}
function demo(dt){
 const px=500+Math.sin(T*.22)*260, py=200+Math.sin(T*.45)*50;
 S.vx=260*.22*Math.cos(T*.22); S.vy=50*.45*Math.cos(T*.45); S.x=px; S.y=py; S.a=Math.atan2(S.vy,S.vx); S.face=Math.cos(S.a)>=0?1:-1; S.tail+=dt*6;
 for(const e of ents)if(!e.dead)e.u(dt); ents=ents.filter(e=>!e.dead); stepParts(dt); follow(dt);
}
function tick(dt){ T+=dt; if(state==='play')update(dt); else if(state==='title'){ demo(dt); music(dt,.15) } }

// ---------- drawing ----------
const STARS=Array.from({length:40},()=>[Math.random()*600,Math.random()*42]);
const BANDS=['#0d4f63','#0a3d50','#073247','#05283a','#041c2c','#03141f','#020c14'];
function drawBG(){
 const sY=sy(SURF);
 g.fillStyle=storm?(lightning>0?'#56688a':'#0b1020'):'#060b18'; g.fillRect(0,0,W,H);
 if(sY>0&&!storm){ g.fillStyle='#c9d6e8'; for(const[a,b]of STARS){ const x=((a-cam.x*.2)%600+600)%600; if(x<W)g.fillRect(x|0,sy(b),1,1) }
  const mx=Math.round(206-cam.x*.05); g.fillStyle='#e6f1ee'; g.beginPath(); g.arc(mx,sy(16),6,0,6.3); g.fill(); g.fillStyle='#060b18'; g.beginPath(); g.arc(mx+3,sy(14),5,0,6.3); g.fill() }
 for(let y=Math.max(0,sY);y<H;y+=2){ const d=(y+cam.y-SURF)/(world.h-SURF); g.fillStyle=BANDS[clamp(Math.floor(d*BANDS.length*1.1),0,BANDS.length-1)]; g.fillRect(0,y,W,2) }
 const k=L.temp!==undefined?Math.max(.15,L.temp/100):1;
 for(let x=0;x<W;x+=2){ const cy=sy(curY(x+cam.x)); g.fillStyle=`rgba(63,208,160,${.2*k})`; g.fillRect(x,cy-CUR,2,CUR*2); g.fillStyle=`rgba(63,208,160,${.12*k})`; g.fillRect(x,cy-CUR/2,2,CUR); g.fillStyle=`rgba(120,240,200,${.5*k})`; g.fillRect(x,cy-CUR,2,1); g.fillRect(x,cy+CUR-1,2,1) }
 g.fillStyle=`rgba(170,255,225,${.85*k})`;
 for(let i=0;i<30;i++){ const wx=cam.x-20+((i*53+T*26)%(W+40)); const y=sy(curY(wx)+Math.sin(i*1.7)*CUR*.8); g.fillRect(Math.round(wx-cam.x),y,1+(i%3===0),1) }
 for(const v of L.vents){ const X=sx(v),fy=sy(floorY(v)); if(X<-30||X>W+30)continue; g.fillStyle='rgba(255,154,31,.06)'; g.fillRect(X-18,fy-125,36,125); g.fillStyle='#2a1c18'; g.fillRect(X-3,fy-12,6,12); g.fillStyle='#ff9a1f'; g.fillRect(X-2,fy-13,4,1) }
 for(let i=Math.floor(cam.x/90);i<=Math.floor((cam.x+W)/90)+1;i++){ const kx=i*90+13, h=18+(i*7%22), base=sy(floorY(kx)); g.fillStyle='#0f3a2e';
  for(let j=0;j<h;j+=2)g.fillRect(sx(kx)+Math.round(Math.sin(T*1.2+i+j*.15)*j*.12),base-j,1,2) }
 for(let x=0;x<W;x++){ const fy=sy(floorY(x+cam.x)); if(fy<H){ g.fillStyle='#0a1418'; g.fillRect(x,fy,1,H-fy); g.fillStyle='#16262b'; g.fillRect(x,fy,1,1) } }
}
function drawFG(){
 const sY=sy(SURF);
 if(sY>-4&&sY<H){ g.fillStyle='rgba(159,216,224,.45)'; for(let x=0;x<W;x++)g.fillRect(x,sY+Math.round(Math.sin((x+cam.x)*.12+T*2)*(storm?2:.8)),1,1) }
 if(storm){ g.fillStyle='rgba(159,179,208,.5)'; for(let i=0;i<50;i++){ const x=(i*37+T*90)%W|0, y=(i*53+T*260)%(H+10)|0; if(y<sY)g.fillRect(x,y,1,3) } }
 for(const p of parts){ const X=sx(p.x),Y=sy(p.y); if(X<0||X>=W||Y<0||Y>=H)continue; g.globalAlpha=clamp(p.life/p.max,0,1); g.fillStyle=p.c; g.fillRect(X,Y,1,1) } g.globalAlpha=1;
 if(hunt>0&&state==='play'){ g.strokeStyle=`rgba(232,65,59,${.4+.3*Math.sin(T*8)})`; g.strokeRect(.5,.5,W-1,H-1) }

}
function render(){

 for(const e of ents)e.l&&e.l();

}

 </div>`) }
function fail(reason){ state='fail'; hudShow(false); sfx.hit();
 screen(`<div class="panel">
  <p class="kicker">FILE ${pad2(lv)} · COMPROMISED</p><h1 class="h2">The trail goes cold</h1>
  <p class="lede">${reason}</p>
  <div class="row"><button class="cta" data-act="retry">Try again</button><button class="cta alt" data-act="title">All files</button></div>
 </div>`) }
function ending(){ screen(`<div class="panel">
  <p class="kicker">FINAL FILE · CLOSED</p><h1>MEG</h1>
  <p class="lede">The young one swims free. The base goes dark. By morning the incident report reads: equipment failure, cause unknown.</p>
  <p class="lede">The current stays warm. Nobody will believe the fishermen.</p>
  <div class="row"><button class="cta" data-act="new">Play again</button><button class="cta alt" data-act="title">All files</button></div>
 </div>`) }
function pause(){ if(state!=='play')return; state='paused'; screen(`<div class="panel"><p class="kicker">FILE ${pad2(lv)} · ON HOLD</p><h1 class="h2">Paused</h1>
  <div class="row"><button class="cta" data-act="resume">Resume</button><button class="cta alt" data-act="retry">Restart file</button><button class="cta alt" data-act="title">All files</button></div></div>`) }
function resume(){ if(state!=='paused')return; state='play'; screen(null); last=performance.now(); acc=0 }
function startDemo(){ world={w:1400,h:360}; L={vents:[],prog:()=>''}; storm=false; ents=[]; parts=[]; hunt=0; stats=freshStats(); S=newShark(1.2);
 school(400,190,8); school(800,230,8); boat(600,{light:true,speed:10}); follow(0,true) }
let wl=null;
async function wake(){ try{ if(navigator.wakeLock&&!wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{wl=null}) } }catch(e){} }
function startLevel(n){ lv=n; const d=LEVELS[n-1]; L=Object.assign({},d); L.vents=[]; if(d.temp)L.temp=d.temp;
 world={w:d.w,h:360}; storm=!!d.storm; boltT=3; ents=[]; parts=[]; hunt=0; shake=0; flashA=0; stats=freshStats(); S=newShark(SIZES[n-1]);
 L.setup(); follow(0,true); state='play'; screen(null); for(const k in hc)delete hc[k]; hudShow(true); banner(d.n.toUpperCase(),2); wake(); last=performance.now(); acc=0 }

// ---------- controls outside the game ----------
function toggleMute(){ muted=!muted; store.set('meg.muted',muted); if(master)master.gain.value=muted?0:.5; $('bMute').textContent=muted?'SOUND OFF':'SOUND ON' }
$('bMute').addEventListener('click',()=>{audio();toggleMute()}); $('bPause').addEventListener('click',()=>{ state==='play'?pause():resume() });
function onKey(e){ const c=e.code;
 if(c==='KeyM')toggleMute();
 else if(c==='Escape'||c==='KeyP'){ if(state==='play')pause(); else if(state==='paused')resume() }
 else if((c==='Enter'||c==='Space')&&state!=='play'&&!(e.target instanceof HTMLButtonElement)){ const b=scr.querySelector('.cta'); b&&b.click() } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden)pause(); else if(state==='play')wake() });

// ---------- layout: whole-number scaling where it fits ----------
function layout(){ const st=$('stage').getBoundingClientRect(), portrait=st.height>st.width*1.1;
 const avH=portrait?st.height*.6:st.height; let sc=Math.min(st.width/W,avH/H); if(sc>=2)sc=Math.floor(sc);
 const cw=Math.round(W*sc),ch=Math.round(H*sc),left=Math.round((st.width-cw)/2),top=portrait?Math.round(Math.max(52,(avH-ch)/2)):Math.round((st.height-ch)/2);
 for(const el of [cv,$('crt'),$('hud')])Object.assign(el.style,{left:left+'px',top:top+'px',width:cw+'px',height:ch+'px'});
 $('hud').style.fontSize=Math.max(13,ch/144*7.5)+'px'; $('crt').style.display=sc>=2?'block':'none' }
addEventListener('resize',layout); if(window.ResizeObserver)new ResizeObserver(layout).observe($('stage'));
$('bMute').textContent=muted?'SOUND OFF':'SOUND ON';
layout(); showTitle(); requestAnimationFrame(frame);
})();
</script>
