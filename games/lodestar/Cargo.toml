# The LodeStar workspace. The root package is lodestar-core: the rules, with no engine dependency
# (src/lib.rs: use cases, features and capabilities). See docs/DESIGN.md § Project layout.
[workspace]
members = [".", "src/presentation/bridge", "src/hosting/godot"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
godot = "=0.5.5"
lodestar-core = { path = "." }
lodestar-bridge = { path = "src/presentation/bridge" }

[package]
name = "lodestar-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "LodeStar's rules: a deterministic simulation with no engine dependency."

[lib]
path = "src/lib.rs"
