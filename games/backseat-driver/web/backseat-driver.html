<title>Backseat Driver</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root { --bg: #14141c; --panel: #23232d; --ink: #f2f0ea; --muted: #a9a9bb; --accent: #ffd21f; --good: #4ac26b; --edge: #e8e8f0; color-scheme: dark; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
  canvas { display: block; width: min(100%, max(320px, calc((100vh - 200px) * 16 / 9))); margin: 0 auto; height: auto; aspect-ratio: 16 / 9; border-radius: 10px; background: #000; touch-action: manipulation; }
  #bar { width: min(100%, 1100px); margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; transition: opacity .15s; }
  #bar.off { opacity: .35; }
  #bar button { display: flex; gap: 10px; align-items: flex-start; text-align: left; min-height: 72px; padding: 12px; font: inherit; font-size: 1rem; line-height: 1.3;
    color: var(--ink); background: #2e3a52; border: 3px solid var(--edge); border-radius: 10px; cursor: pointer; }
  #bar button:hover:not(:disabled) { background: #42578a; }
  #bar button:active:not(:disabled) { background: #4f9a5f; }
  #bar button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #bar button:disabled { cursor: default; }
  kbd { flex: none; font: inherit; font-weight: 700; color: var(--accent); }
  .hint { color: var(--muted); font-size: .85rem; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  #snd { font: inherit; font-size: .85rem; color: var(--ink); background: var(--panel); border: 1px solid #55556a; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #snd:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { #bar { grid-template-columns: 1fr; } #bar button { min-height: 56px; } }
</style>
<div class="wrap">
  <canvas id="c" width="1280" height="720" aria-label="Backseat Driver game view"></canvas>
  <div id="bar" role="group" aria-label="What to scream at the driver"><button type="button"></button><button type="button"></button><button type="button"></button></div>
  <p class="hint">Keys 1, 2, 3 to scream. Space or click the road to start. M mutes. <button type="button" id="snd">Sound: on</button></p>
</div>
<script>
// Synthesised sound: engine, road noise, passing traffic, horns, and event cues. No audio files.
const AU = {
  ctx: null, on: true, master: null, eng1: null, eng2: null, engGain: null, engLp: null, roadGain: null, roadBp: null, noise: null,
  next: 3, init() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const c = (this.ctx = new C());
      this.master = c.createGain(); this.master.gain.value = this.on ? 0.8 : 0; this.master.connect(c.destination);
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      this.engLp = c.createBiquadFilter(); this.engLp.type = "lowpass"; this.engLp.frequency.value = 300;
      this.engGain = c.createGain(); this.engGain.gain.value = 0.0;
      this.eng1 = c.createOscillator(); this.eng1.type = "sawtooth";
      this.eng2 = c.createOscillator(); this.eng2.type = "square";
      this.eng1.connect(this.engLp); this.eng2.connect(this.engLp); this.engLp.connect(this.engGain); this.engGain.connect(this.master);
      this.eng1.start(); this.eng2.start();
      const rs = c.createBufferSource(); rs.buffer = buf; rs.loop = true;
      this.roadBp = c.createBiquadFilter(); this.roadBp.type = "bandpass"; this.roadBp.frequency.value = 700; this.roadBp.Q.value = 0.6;
      this.roadGain = c.createGain(); this.roadGain.gain.value = 0;
      rs.connect(this.roadBp); this.roadBp.connect(this.roadGain); this.roadGain.connect(this.master); rs.start();
    } catch (e) { this.ctx = null; }
  },
  toggle() {
    this.on = !this.on;
    if (this.master) this.master.gain.setTargetAtTime(this.on ? 0.8 : 0, this.ctx.currentTime, 0.05);
    return this.on;
  },
  // called every frame
  update(mph, dt, driving) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, v = Math.max(0, mph);
    this.eng1.frequency.setTargetAtTime(34 + v * 1.3, t, 0.08);
    this.eng2.frequency.setTargetAtTime(17 + v * 0.65, t, 0.08);
    this.engLp.frequency.setTargetAtTime(160 + v * 7, t, 0.1);
    this.engGain.gain.setTargetAtTime(driving ? 0.05 : 0.0, t, 0.2);
    this.roadGain.gain.setTargetAtTime(Math.min(0.14, v / 80 * 0.14), t, 0.1);
    this.roadBp.frequency.setTargetAtTime(400 + v * 10, t, 0.1);
    if (driving) { this.next -= dt; if (this.next <= 0) { this.next = 2 + Math.random() * 5; Math.random() < 0.6 ? this.pass() : this.honk(true); } }
  },
  _env(g, t0, a, d, peak) { g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); },
  noiseBurst(dur, type, f0, f1, peak, att, pan) {
    const c = this.ctx; if (!c || !this.on) return; const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = c.createGain(); this._env(g, t, att === undefined ? 0.02 : att, dur, peak);
    s.connect(f); f.connect(g);
    if (c.createStereoPanner && pan !== undefined) { const p = c.createStereoPanner(); p.pan.setValueAtTime(pan, t); p.pan.linearRampToValueAtTime(-pan, t + dur); g.connect(p); p.connect(this.master); } else g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.2);
  },
  tone(freq, dur, type, peak, f1, delay) {
    const c = this.ctx; if (!c || !this.on) return; const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); this._env(g, t, 0.01, dur, peak);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.1);
  },
  pass() { const d = 0.9 + Math.random() * 0.8, side = Math.random() < 0.5 ? -1 : 1; this.noiseBurst(d, "bandpass", 250, 900 + Math.random() * 500, 0.22, d * 0.45, side * 0.9); },
  honk(far) { const k = far ? 0.05 : 0.16, f = 330 + Math.random() * 120; this.tone(f, 0.35, "square", k, f * 0.99); this.tone(f * 1.26, 0.35, "square", k, f * 1.25); },
  screech() { this.noiseBurst(1.0, "bandpass", 3200, 1700, 0.3, 0.03); this.tone(1900, 0.9, "sawtooth", 0.05, 1200); },
  crash() { this.noiseBurst(0.8, "lowpass", 2600, 120, 0.7, 0.005); this.tone(90, 0.6, "sine", 0.6, 28); this.tone(230, 0.25, "square", 0.12, 90); this.noiseBurst(1.4, "highpass", 5000, 3000, 0.08, 0.1); },
  good() { this.tone(660, 0.18, "triangle", 0.2); this.tone(880, 0.25, "triangle", 0.2, null, 0.12); this.tone(1320, 0.3, "triangle", 0.15, null, 0.26); },
  ding() { this.tone(1046, 0.25, "sine", 0.18); },
  tick() { this.tone(700, 0.05, "square", 0.05); },
  scream() { this.tone(520, 0.5, "sawtooth", 0.09, 880); this.tone(780, 0.5, "square", 0.04, 1250); },
  cue(id) {
    switch (id) {
      case "ducks": for (let i = 0; i < 4; i++) { this.tone(430, 0.12, "sawtooth", 0.1, 250, i * 0.22); this.tone(380, 0.1, "sawtooth", 0.08, 230, i * 0.22 + 0.11); } break;
      case "police": for (let i = 0; i < 4; i++) this.tone(i % 2 ? 960 : 720, 0.3, "sine", 0.1, null, i * 0.3); break;
      case "train": this.tone(311, 1.4, "sawtooth", 0.1); this.tone(392, 1.4, "sawtooth", 0.1); this.tone(311, 0.8, "sawtooth", 0.1, null, 1.5); this.tone(392, 0.8, "sawtooth", 0.1, null, 1.5); break;
      case "wrongway": this.honk(false); this.tone(330, 0.5, "square", 0.12, null, 0.5); this.tone(415, 0.5, "square", 0.12, null, 0.5); break;
      case "bus": for (let i = 0; i < 3; i++) this.tone(900, 0.12, "square", 0.07, null, i * 0.28); break;
      case "gator": this.noiseBurst(1.2, "lowpass", 220, 70, 0.3, 0.2); break;
      case "deer": this.tone(600, 0.2, "triangle", 0.06, 420); this.tone(520, 0.25, "triangle", 0.06, 360, 0.3); break;
      case "rocks": for (let i = 0; i < 6; i++) this.noiseBurst(0.18, "lowpass", 900, 200, 0.18, 0.005); break;
      case "minspeed": this.honk(false); break;
      default: this.honk(true);
    }
  },
};

const W = 1280, H = 720, HORIZON = 285, ROAD_B = 600, TAU = Math.PI * 2;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = 'system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

const P = (x, s) => [W / 2 + x * s, HORIZON + (ROAD_B - HORIZON) * s];
const scaleOf = (d) => 0.03 + d * d;
// point offset: p + Vector2(dx, dy) * u
const o = (p, dx, dy, u) => [p[0] + dx * u, p[1] + dy * u];
const hexc = (h) => "#" + h;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fpos = (a, b) => ((a % b) + b) % b;
const moveToward = (v, t, d) => (Math.abs(t - v) <= d ? t : v + Math.sign(t - v) * d);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function poly(pts, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}
function el(p, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(p[0], p[1], Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, TAU);
  ctx.fill();
}
function circ(p, r, color) { el(p, r, r, color); }
function rc(p, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(p[0] - w / 2, p[1] - h / 2, w, h);
}
function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
function line(a, b, color, w) {
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, w);
  ctx.lineCap = "butt";
  ctx.beginPath();
  ctx.moveTo(a[0], a[1]);
  ctx.lineTo(b[0], b[1]);
  ctx.stroke();
}
function arc(p, r, a0, a1, color, w) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.arc(p[0], p[1], r, a0, a1);
  ctx.stroke();
}
function setFont(fs, bold) { ctx.font = (bold === false ? "" : "bold ") + fs + "px " + FONT; }
function txt(s, x, y, fs, color, align, shadow) {
  setFont(fs);
  ctx.textAlign = align || "left";
  if (shadow !== false) { ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillText(s, x + 2, y + 2); }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function wrap(text, maxW, fs, bold) {
  setFont(fs, bold);
  const out = [];
  for (const para of text.split("\n")) {
    let cur = "";
    for (const w of para.split(" ")) {
      const t = cur ? cur + " " + w : w;
      if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t;
    }
    out.push(cur);
  }
  return out;
}
function mtxt(text, x, y, maxW, fs, color, align, bold) {
  const lines = wrap(text, maxW, fs, bold);
  setFont(fs, bold);
  ctx.textAlign = align || "left";
  ctx.fillStyle = color;
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * fs * 1.28));
  return lines.length * fs * 1.28;
}
function panel(x, y, w, h, fill, edge) {
  rect(x, y, w, h, fill);
  ctx.strokeStyle = edge; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
}
function bubble(x, y, text, width, fill, ink, fs) {
  const lh = fs * 1.28, n = wrap(text, width, fs, false).length, h = n * lh + 20;
  panel(x, y, width + 24, h, fill, ink);
  mtxt(text, x + 12, y + 10 + fs, width, fs, ink, "left", false);
  return h;
}
function person(g, h, shirt, skin, walk, hair) {
  const sw = Math.sin(walk) * h * 0.12, legc = "#2b2b3a", hip = o(g, 0, -h * 0.45, 1);
  line(hip, o(g, sw, 0, 1), legc, h * 0.09);
  line(hip, o(g, -sw, 0, 1), legc, h * 0.09);
  rc(o(g, 0, -h * 0.65, 1), h * 0.28, h * 0.4, shirt);
  line(o(g, 0, -h * 0.8, 1), o(g, sw * 1.3, -h * 0.55, 1), skin, h * 0.07);
  line(o(g, 0, -h * 0.8, 1), o(g, -sw * 1.3, -h * 0.55, 1), skin, h * 0.07);
  circ(o(g, 0, -h * 0.9, 1), h * 0.1, skin);
  el(o(g, 0, -h * 0.96, 1), h * 0.1, h * 0.055, hair);
}
function signPlate(shape, c, size, col, ink, glyph) {
  const r = size * 0.5;
  let pts = [];
  if (shape === "diamond") { const k = r * 1.3; pts = [[c[0], c[1] - k], [c[0] + k, c[1]], [c[0], c[1] + k], [c[0] - k, c[1]]]; }
  else if (shape === "octagon") for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; pts.push([c[0] + Math.cos(a) * r * 1.15, c[1] + Math.sin(a) * r * 1.15]); }
  else if (shape === "circle") for (let i = 0; i < 24; i++) { const a = TAU * i / 24; pts.push([c[0] + Math.cos(a) * r * 1.1, c[1] + Math.sin(a) * r * 1.1]); }
  else pts = [[c[0] - r * 1.15, c[1] - r * 0.95], [c[0] + r * 1.15, c[1] - r * 0.95], [c[0] + r * 1.15, c[1] + r * 0.95], [c[0] - r * 1.15, c[1] + r * 0.95]];
  poly(pts, col);
  ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(1, size * 0.04);
  ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.stroke();
  if (size < 34) return;
  const lines = glyph.split("\n"), fs = Math.floor(size * (glyph.length <= 4 ? 0.3 : 0.2));
  lines.forEach((l, i) => txt(l, c[0], c[1] + (i - (lines.length - 1) / 2) * fs * 1.1 + fs * 0.35, fs, ink, "center", false));
}

// Icelandic-style road signs, redrawn in code (simplified; not the official artwork).
// Warning: red-bordered triangle on yellow. Prohibition: red-ringed circle on yellow.
// Mandatory: blue circle, white border. Information: blue rectangle. Stop: red octagon.
const YEL = "#f6c600", RED = "#d3262b", BLU = "#0d4fa6", INK = "#111", WHT = "#fff";
let K = INK; // current pictogram ink
const pl = (pts, w) => { ctx.strokeStyle = K; ctx.lineWidth = w || 0.12; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); };
const pg = (pts, col) => { ctx.fillStyle = col || K; ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.fill(); };
const ci = (x, y, r, col) => { ctx.fillStyle = col || K; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
const oval = (x, y, rx, ry, col) => { ctx.fillStyle = col || K; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); };
const stk = (x, y, r, w, col) => { ctx.strokeStyle = col || K; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); };
const head = (x, y, a, s) => pg([[x + Math.cos(a) * s, y + Math.sin(a) * s], [x + Math.cos(a + 2.5) * s, y + Math.sin(a + 2.5) * s], [x + Math.cos(a - 2.5) * s, y + Math.sin(a - 2.5) * s]]);
const arrow = (pts, w) => { pl(pts, w || 0.16); const a = pts[pts.length - 2], b = pts[pts.length - 1]; head(b[0], b[1], Math.atan2(b[1] - a[1], b[0] - a[0]), 0.3); };
const utxt = (s, x, y, fs) => { ctx.fillStyle = K; ctx.font = `bold ${fs}px ${FONT}`; ctx.textAlign = "center"; ctx.fillText(s, x, y + fs * 0.35); };

// vehicles (side view)
function car(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); pg([[-0.6, 0.15], [-0.55, -0.05], [-0.25, -0.3], [0.25, -0.3], [0.45, -0.05], [0.6, 0.15]]); ci(-0.33, 0.18, 0.14, K); ci(0.33, 0.18, 0.14, K); ctx.restore(); }
function truck(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); pg([[-0.7, -0.35], [0.2, -0.35], [0.2, 0.15], [-0.7, 0.15]]); pg([[0.25, -0.15], [0.5, -0.15], [0.65, 0.0], [0.65, 0.15], [0.25, 0.15]]); ci(-0.45, 0.2, 0.13, K); ci(0.0, 0.2, 0.13, K); ci(0.45, 0.2, 0.13, K); ctx.restore(); }
function bus(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); pg([[-0.7, -0.35], [0.65, -0.35], [0.7, 0.15], [-0.7, 0.15]]); ci(-0.4, 0.2, 0.13, K); ci(0.4, 0.2, 0.13, K); ctx.restore(); }
function moto(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); stk(-0.4, 0.1, 0.22, 0.09); stk(0.4, 0.1, 0.22, 0.09); pl([[-0.4, 0.1], [-0.1, -0.15], [0.3, -0.15], [0.4, 0.1]], 0.09); pg([[-0.15, -0.2], [0.2, -0.2], [0.15, -0.35], [-0.1, -0.35]]); ctx.restore(); }
function bike(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); stk(-0.4, 0.15, 0.25, 0.07); stk(0.4, 0.15, 0.25, 0.07); pl([[-0.4, 0.15], [-0.1, -0.2], [0.25, -0.2], [0.4, 0.15], [0.05, 0.15], [-0.1, -0.2]], 0.07); pl([[0.25, -0.2], [0.3, -0.4], [0.45, -0.4]], 0.07); pl([[-0.2, -0.25], [-0.05, -0.25]], 0.09); ctx.restore(); }
function sPerson(x, y, s, walk) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ci(0, -0.6, 0.16); pg([[-0.18, -0.4], [0.18, -0.4], [0.14, 0.1], [-0.14, 0.1]]); const w = walk ? 0.16 : 0.08; pl([[-0.07, 0.1], [-w, 0.5]], 0.14); pl([[0.07, 0.1], [w, 0.5]], 0.14); pl([[-0.18, -0.35], [-0.3, 0.0]], 0.1); pl([[0.18, -0.35], [0.3, 0.0]], 0.1); ctx.restore(); }

E({ id: "sheep", sign: "A11.37", hz: "sheep", spd: 60, scene: "A flock of sheep has strolled onto the road. In Iceland they have right of way, and they know it.",
  c: ["BRAKE, YOU MORON! SHEEP!", 5], w: ["THEY'RE JUST CLOUDS, YOU GOOSE! DRIVE!", 60, "Clouds do not go baa. The ram has opinions about your bumper, and so does your insurance."],
  good: "The driver stops. A hundred sheep cross with the confidence of animals who own the road. Which, in Iceland, they do.", late: "BAAAA-THUMP. The sheep wins. Your bumper does not, and neither does the farmer's mood.", fx: "f4f1ea" });
E({ id: "horse", sign: "A11.32", hz: "horse", spd: 55, scene: "Three horses ride the shoulder like they pay the road tax. One of them looks at your car and sighs.",
  c: ["SLOW DOWN, YOU IDIOT! HORSES!", 10], w: ["HONK AT THEM, YOU GENIUS!", 55, "Horses hate honking. One leaves through your windscreen. A horse is five hundred kilos of regret."],

E({ id: "cow", sign: "A11.36", hz: "cow", spd: 50, scene: "A cow stands in the road chewing. The cow has been there since the 1990s.",

  good: "The cows cross. One stops to stare at you. Nobody argues with a cow.", late: "The cow has right of way, a ribcage like a bus and no insurance.", fx: "e8e4dc" });
E({ id: "reindeer", sign: "A11.38", hz: "deer", spd: 60, scene: "Two glowing eyes in the dusk at the roadside. Then four. Then they step out, antlers first.",
  c: ["SLOW DOWN, YOU MORON! REINDEER!", 10], w: ["FLASH THE HIGH BEAMS, GENIUS!", 60, "Reindeer freeze when you flash lights. It is the entire thing they do. The car and the reindeer are now one."],
  good: "The driver brakes. A stag pauses, locks eyes with you, then wanders off with deep disdain.", late: "BANG. Your bonnet has an antler now. The reindeer is on the roof, looking at you like you owe it money.", fx: "8a5a2b" });
E({ id: "ducks", sign: "146", hz: "ducks", spd: 50, scene: "The sign says animals. A flock of ducks waddles across, in no hurry whatsoever.",
  c: ["BRAKE, YOU MORON! DUCKS!", 5], w: ["AWW, LOOK AT THE DUCKS, YOU GOOSE!", 45, "The driver looks. The ducks look back. Briefly. Then there are feathers. So many feathers."],
  good: "The driver brakes. The ducks cross in a tiny, smug parade. The last one nods at you. You will carry that nod forever.", late: "Nobody said anything useful. The ducks said quack, and then nothing at all. The wipers are on paté setting.", fx: "f4f0dc" });
E({ id: "gator", sign: "146", hz: "gator", spd: 45, scene: "The sign says animals. Nobody explains why a gator is sunbathing across both lanes in Iceland.",
  c: ["BRAKE, YOU MORON! THAT'S A GATOR!", 8], w: ["IT'S A LOG, YOU COWARD! RUN IT OVER!", 45, "It was not a log. The log now has your whole arm and a strong opinion about your elbow."],
  good: "The driver slows. The gator ambles across and gives you a long, assessing stare. You were not the snack. This time.", late: "The gator takes your silence as an order for takeout. Compliments to the chef. The chef is you.", fx: "4a8f3a" });
E({ id: "pedx", sign: "A11.22", hz: "walker", spd: 35, scene: "A very elderly man with a walker has started crossing. He has all day. You do not.",
  c: ["STOP, YOU MANIAC! LET HIM CROSS!", 0], w: ["HE'LL MAKE IT, GRANDMA! KEEP GOING!", 35, "He did not make it. The walker made it. It is now a bonnet ornament and, honestly, a fairly nice one."],
  good: "The driver stops. Eleven minutes later, the man reaches the far side, tips his hat and calls you sweetheart.", late: "A walker flies past the passenger window. Silently. Like a very sad bird.", fx: "c0c4cc" });
E({ id: "children", sign: "A11.11", hz: "kids", spd: 40, scene: "A ball bounces into the road. A small child is already running after it.",
  c: ["BRAKE, YOU IDIOT! A KID!", 0], w: ["IT'S JUST A BALL, YOU WIMP!", 40, "It was a ball. Then it was not just a ball. The driver says nothing for forty miles. Neither do you."],
  good: "Tires scream. The kid grabs the ball, waves, and calls the driver a word you did not know a six-year-old knew. Worth it.", late: "Thud. Silence. 'That was a ball, right?' the driver asks, very small. You both decide to believe it was a ball.", fx: "e8453c" });
E({ id: "cyclist", sign: "A11.41", hz: "cyclist", spd: 45, scene: "A cyclist in neon lycra is crossing the road, fast, with the calm of someone who has right of way and a helmet.",
  c: ["BRAKE, MORON! CYCLIST CROSSING!", 5], w: ["RACE HIM, YOU TURTLE! FASTER!", 60, "You race him. You lose. By the time the driver stops, he has uploaded the whole thing to the internet."],
  good: "The driver brakes. The cyclist crosses, clips out of one pedal, salutes with two fingers, and pedals off like a rocket.", late: "A bicycle bell. A shriek. A neon blur over the bonnet. He lands in a bush with the dignity of a cat.", fx: "3cd0a0" });
E({ id: "curve", sign: "A01.11", hz: "curve", spd: 65, scene: "A hairpin to the right. A wall on one side. A nice view of the valley, from above and then from below, on the other.",
  c: ["TOO FAST, YOU MANIAC! CURVE!", 15], w: ["DRIFT IT, TURTLE! FASTER!", 85, "The drift is magnificent. The landing is not. You get excellent views of the valley for four whole seconds."],
  good: "The driver slows. The car hugs the curve like an old friend. Far below, a wrecked car whispers: tell my story.", late: "The tires scream. The car sails off the cliff in slow motion. The driver says, 'Huh.' It is the last thing anyone says.", fx: "ffb000" });
E({ id: "descent", sign: "A18", hz: "steep", spd: 70, scene: "A twelve percent descent. The driver is in neutral 'to save petrol'. The brakes are already smelling.",
  c: ["SHIFT DOWN, YOU MORON! BRAKE GENTLY!", 30], w: ["COAST, GENIUS! SAVE THE FUEL!", 105, "Downhill in neutral is a roller coaster with a wallet attached. The brakes smell like a barbecue. It is not a good barbecue."],
  good: "The driver drops a gear and the engine growls like a happy dog. The descent ends with brakes that are merely warm.", late: "The needle climbs and so does the driver's voice. The runaway lane does not exist. The ditch does.", fx: "9a9aa2" });
E({ id: "ascent", sign: "A19", hz: "steep", spd: 30, scene: "A steep climb. The driver is doing 30 in fifth gear and the engine is crying quietly.",
  c: ["SHIFT DOWN, YOU MORON! GO GO GO!", 55], w: ["STOP AND ADMIRE THE VIEW, SNAIL!", 0, "The car stops. The car rolls backwards. Slowly. Then not slowly. The handbrake files a complaint."],
  good: "The driver drops a gear and the little engine finds courage. At the top, the whole country spreads out below.", late: "The engine coughs, the car stalls, and a long line of locals behind you remembers every word of Icelandic profanity.", fx: "9a9aa2" });

E({ id: "narrow", sign: "A14.11", hz: "narrow", spd: 70, scene: "The road squeezes in from both sides. A bus coming the other way takes up most of it.",
  c: ["SLOW DOWN, MORON! IT NARROWS!", 25], w: ["SUCK IN YOUR STOMACH, GENIUS! GO!", 70, "The wing mirror bids farewell. The bus does not. The car now has a very thin side."],
  good: "The driver slows. The bus slides past with the width of a credit card to spare. Both drivers wave. Both pretend not to be sweating.", late: "SCRRRRAPE. Two mirrors, one bus, no manners. The bus keeps going. The bus has places to be.", fx: "9a9aa2" });
E({ id: "bumpy", sign: "A20.11", hz: "bump", spd: 60, scene: "The road turns into a washboard for half a mile. The driver's coffee notices first.",
  c: ["SLOW DOWN, YOU MORON! BUMPY ROAD!", 25], w: ["GO FASTER! IT SMOOTHS OUT!", 70, "It does not smooth out. Your teeth become a percussion section and the coffee has a short, violent career."],
  good: "The driver eases down. The car rumbles over the ripples like a tractor on a trampoline. The coffee survives.", late: "Everything rattles. Every filling. Every thought. Your dentist will send a thank-you card.", fx: "6b4a2b" });
E({ id: "bump", sign: "A20.21", hz: "bump", spd: 45, scene: "A painted hump crosses the road. The driver's coffee is not ready for this.",
  c: ["SLOW DOWN, YOU MORON! HUMP!", 10], w: ["DON'T BRAKE! GET SOME AIR!", 75, "The car takes off. For one beautiful second you are a bird. Then the suspension files a formal complaint, and so does the coffee, on your lap."],
  good: "The driver slows to a crawl and rolls over the hump. The coffee survives. The driver is unbearable about it for a mile.", late: "THUMP. THUMP-THUMP. The coffee lands on the driver, who screams something your mother would not like.", fx: "6b4a2b" });
E({ id: "works", sign: "A17.11", hz: "work", spd: 60, scene: "Orange cones, a digger and a man with a shovel leaning on it. He has been leaning for some time.",

E({ id: "gravel", sign: "A22.11", hz: "gravel", spd: 80, scene: "The tarmac gives way to loose gravel. The driver is doing 80 and humming.",
  c: ["SLOW DOWN, YOU MANIAC! GRAVEL!", 40], w: ["FASTER! STONES ARE JUST TINY HILLS!", 90, "The stones ping off the paint like a drum solo. Your windscreen gets a new constellation. So does the car behind you."],
  good: "The driver slows, the gravel hisses beneath the tyres, and the windscreen stays in one piece. Barely.", late: "PING. PING-PING-CRACK. A star bursts across the windscreen. The driver says nothing because the driver cannot see.", fx: "b8a48a" });

E({ id: "twoway", sign: "A25.11", hz: "wrongway", spd: 65, scene: "The road ahead becomes two-way. The driver is in the middle of it, humming, overtaking a caravan.",

function key(code) {

function drawEvent() {

function drawCabin() {

function drawMirrorTruck() {

function drawSpeedo() {

function drawHud() {
